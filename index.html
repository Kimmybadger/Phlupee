  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body { background:#1a0a2e; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; min-height:100dvh; font-family:'Segoe UI',sans-serif; overflow:hidden; touch-action:none; user-select:none; }

    #joystickCanvas { position:absolute; bottom:0; left:0; width:100%; height:100%; pointer-events:none; }
    #hideBtn { position:absolute; bottom:14px; right:14px; width:68px; height:68px; border-radius:50%; background:rgba(80,40,120,0.4); border:3px solid #c9a0ff; color:#fff; font-size:1.5rem; display:none; align-items:center; justify-content:center; z-index:20; box-shadow:0 0 20px #9933ff60; cursor:pointer; flex-direction:column; gap:1px; transition:background 0.15s,border-color 0.15s; }
    #hideBtn .btn-label { font-size:0.55rem; color:#e0ccff; letter-spacing:0.04em; }

    #phaseBtn { position:absolute; bottom:90px; right:14px; width:56px; height:56px; border-radius:50%; background:rgba(153,51,255,0.3); border:3px solid #c9a0ff; color:#fff; font-size:1.4rem; display:none; align-items:center; justify-content:center; z-index:20; box-shadow:0 0 20px #9933ff60; cursor:pointer; }

    #char-select { position:fixed; top:0; left:0; width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:100; background:radial-gradient(ellipse at center,#2a0e4a 0%,#0f0520 70%); overflow-y:auto; padding:16px 8px 24px; }
    #char-select h2 { font-size:clamp(1.2rem,5vw,2rem); color:#ffb3d9; text-shadow:0 0 30px #ff69b4; margin-bottom:4px; letter-spacing:0.08em; animation:titlePulse 2s ease-in-out infinite; }
    @keyframes titlePulse { 0%,100%{text-shadow:0 0 20px #ff69b4}50%{text-shadow:0 0 40px #ff69b4,0 0 80px #ff69b480} }

    .char-card { background:rgba(255,255,255,0.05); border:2px solid rgba(255,255,255,0.1); border-radius:16px; padding:12px 8px; cursor:pointer; text-align:center; transition:transform 0.15s,border-color 0.15s,box-shadow 0.15s; }

    .char-card[data-id="rosie"]{--accent:#ff85c2;} .char-card[data-id="rosie"].selected,.char-card[data-id="rosie"]:active{border-color:#ff85c2;box-shadow:0 6px 24px #ff85c240;}
    .char-card[data-id="sunny"]{--accent:#ffe04a;} .char-card[data-id="sunny"].selected,.char-card[data-id="sunny"]:active{border-color:#ffe04a;box-shadow:0 6px 24px #ffe04a40;}
    .char-card[data-id="minty"]{--accent:#80ffcc;} .char-card[data-id="minty"].selected,.char-card[data-id="minty"]:active{border-color:#80ffcc;box-shadow:0 6px 24px #80ffcc40;}
    .char-card[data-id="lavi"] {--accent:#c9a0ff;} .char-card[data-id="lavi"].selected,.char-card[data-id="lavi"]:active{border-color:#c9a0ff;box-shadow:0 6px 24px #c9a0ff40;}

    .start-btn:disabled{opacity:0.35;animation:none;} @keyframes btnFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

    .opt-row { display:flex; align-items:center; gap:10px; }
    .opt-label { color:#c9a0dc; font-size:0.8rem; width:64px; flex-shrink:0; }
    .opt-val { color:#ffb3d9; font-size:0.75rem; width:28px; text-align:right; }
    input[type=range] {

    }
    input[type=range]::-webkit-slider-thumb {

    .opt-divider { height:1px; background:rgba(255,105,180,0.2); margin:2px 0; }
    .opt-btn {
      border:none; border-radius:12px; padding:11px 0;
      font-size:0.9rem; font-weight:bold; cursor:pointer;

    }
    .opt-btn:active { transform:scale(0.97); filter:brightness(1.2); }
    .opt-btn-green  { background:linear-gradient(135deg,#1a8a4a,#0f6030); color:#b0ffcc; }
    .opt-btn-yellow { background:linear-gradient(135deg,#7a6000,#5a4400); color:#ffe04a; }
    .opt-btn-red    { background:linear-gradient(135deg,#8a1a2e,#601020); color:#ffb3c0; }

idth="70" height="70"></canvas><div class="char-name">Lavi</div><span class="char-tag">🌀 Ghost Walk</span><div class="char-stats"><div class="stat-row"><span class="stat-label">Speed</span><div class="stat-bar"><div class="stat-fill" style="width:60%"></div></div></div><div class="stat-row"><span class="stat-label">Sight</span><div class="stat-bar"><div class="stat-fill" style="width:60%"></div></div></div><div class="stat-row"><span class="stat-label">Hearts</span><div class="stat-bar"><div class="stat-fill" style="width:60%"></div></div></div></div></div></div>

<script>
// ══════════════════════════════════════
//  SAFARI POLYFILL
//  roundRect는 Safari 16+ 에서만 지원됨.
//  구버전 Safari를 위해 폴리필 추가.
// ══════════════════════════════════════
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    if(typeof r==='number') r={tl:r,tr:r,br:r,bl:r};
    const {tl=0,tr=0,br=0,bl=0}=r||{};
    this.beginPath();
    this.moveTo(x+tl,y);
    this.lineTo(x+w-tr,y); this.quadraticCurveTo(x+w,y,x+w,y+tr);
    this.lineTo(x+w,y+h-br); this.quadraticCurveTo(x+w,y+h,x+w-br,y+h);
    this.lineTo(x+bl,y+h); this.quadraticCurveTo(x,y+h,x,y+h-bl);
    this.lineTo(x,y+tl); this.quadraticCurveTo(x,y,x+tl,y);
    this.closePath();
    return this;
  };
}

// ══════════════════════════════════════
//  RESPONSIVE CANVAS
// ══════════════════════════════════════
const GAME_W=600, GAME_H=560;
let gameScale=1;
function resizeGame(){
  const maxW=Math.min(window.innerWidth,window.innerHeight*(GAME_W/GAME_H));
  gameScale=maxW/GAME_W;
  const cv=document.getElementById('game');
  cv.width=GAME_W;cv.height=GAME_H;cv.style.width=maxW+'px';cv.style.height=(maxW*(GAME_H/GAME_W))+'px';
  const jz=document.getElementById('joystickZone');jz.style.width=maxW+'px';jz.style.height=(maxW*(GAME_H/GAME_W))+'px';
  const jc=document.getElementById('joystickCanvas');jc.width=maxW;jc.height=maxW*(GAME_H/GAME_W);
  const sz=Math.max(52,maxW*0.13);
  const _hide=document.getElementById('hideBtn');
  const _phase=document.getElementById('phaseBtn');
  if(_hide){_hide.style.width=sz+'px';_hide.style.height=sz+'px';_hide.style.fontSize=Math.max(1.1,maxW*0.04)+'px';}
  if(_phase){_phase.style.width=sz+'px';_phase.style.height=sz+'px';_phase.style.fontSize=Math.max(1.1,maxW*0.04)+'px';}
  const ob=document.getElementById('optBtn');
  if(ob){ob.style.width=Math.max(30,maxW*0.06)+'px';ob.style.height=Math.max(30,maxW*0.06)+'px';}
}
window.addEventListener('resize',resizeGame);

// ══════════════════════════════════════
//  STARS
// ══════════════════════════════════════
const starCanvas=document.getElementById('stars'),sctx=starCanvas.getContext('2d');
starCanvas.width=window.innerWidth;starCanvas.height=window.innerHeight;
const stars=[];
for(let i=0;i<120;i++)stars.push({x:Math.random()*starCanvas.width,y:Math.random()*starCanvas.height,size:Math.random()*2+0.5,opacity:Math.random(),speed:Math.random()*0.02+0.005});
function drawStars(){sctx.clearRect(0,0,starCanvas.width,starCanvas.height);stars.forEach(s=>{s.opacity+=s.speed;if(s.opacity>1||s.opacity<0)s.speed*=-1;sctx.beginPath();sctx.arc(s.x,s.y,s.size,0,Math.PI*2);sctx.fillStyle=`rgba(255,220,255,${Math.abs(s.opacity)})`;sctx.fill();});requestAnimationFrame(drawStars);}
drawStars();

// ══════════════════════════════════════
//  LEVEL THEMES
//  Each theme has: wall color, floor colors, accent,
//  a special particle effect name, and background tint
// ══════════════════════════════════════
const LEVEL_THEMES = [
  {name:'🏰 Dungeon',    wall:'#12082a', wallTop:'#4a2888', floorA:'#1e1038', floorB:'#241440', fog:'purple', particle:'sparkle', bgTint:'rgba(80,0,120,0.06)'},
  {name:'❄️ Ice Cave',   wall:'#060f20', wallTop:'#1a4070', floorA:'#0a1428', floorB:'#0d1a32', fog:'blue',   particle:'snow',    bgTint:'rgba(0,80,180,0.08)'},
  {name:'🌿 Forest',     wall:'#061208', wallTop:'#1a4a12', floorA:'#0a180c', floorB:'#0d1e10', fog:'green',  particle:'leaf',    bgTint:'rgba(0,80,20,0.08)'},
  {name:'🔥 Lava Zone',  wall:'#200a06', wallTop:'#7a2810', floorA:'#180c06', floorB:'#1e100a', fog:'red',    particle:'ember',   bgTint:'rgba(180,40,0,0.08)'},
  {name:'✨ Palace',     wall:'#181200', wallTop:'#806000', floorA:'#140e00', floorB:'#1a1200', fog:'gold',   particle:'star',    bgTint:'rgba(180,140,0,0.08)'},
  {name:'💜 Cyber',      wall:'#0e0618', wallTop:'#4a1278', floorA:'#0a0414', floorB:'#0e0818', fog:'pink',   particle:'spark',   bgTint:'rgba(160,0,160,0.08)'},
  {name:'🌊 Deep Ocean', wall:'#020a18', wallTop:'#0a3060', floorA:'#040e20', floorB:'#061228', fog:'blue',   particle:'snow',    bgTint:'rgba(0,40,120,0.10)'},
  {name:'🍄 Mushroom',   wall:'#180820', wallTop:'#881050', floorA:'#120618', floorB:'#160820', fog:'purple', particle:'sparkle', bgTint:'rgba(140,0,100,0.09)'},
  {name:'☁️ Sky World',  wall:'#0a1020', wallTop:'#204080', floorA:'#0e1830', floorB:'#121e38', fog:'blue',   particle:'snow',    bgTint:'rgba(20,60,180,0.08)'},
  {name:'💀 Shadow',     wall:'#080808', wallTop:'#300000', floorA:'#0c0c0c', floorB:'#101010', fog:'red',    particle:'ember',   bgTint:'rgba(100,0,0,0.12)'},
];
// 5층마다 테마 변경
function getTheme(){return LEVEL_THEMES[Math.min(Math.floor((floorNumber-1)/5),LEVEL_THEMES.length-1)];}

// 난이도 (10층마다 상승)
const DIFF_SETTINGS=[
  {monsterSpeed:1.3,torchMult:1.0,pathInterval:40,itemCount:18},
  {monsterSpeed:1.7,torchMult:0.9,pathInterval:35,itemCount:20},
  {monsterSpeed:2.1,torchMult:0.8,pathInterval:30,itemCount:22},
  {monsterSpeed:2.2,torchMult:0.7,pathInterval:25,itemCount:24},  // tier3: 2.5→2.2
  {monsterSpeed:2.4,torchMult:0.6,pathInterval:20,itemCount:26},  // tier4: 3.0→2.4
];
function getDiffSettings(){return DIFF_SETTINGS[Math.min(Math.floor((floorNumber-1)/10),4)];}

const MAX_FLOOR=50;
let gameCleared=false;

// Ambient particles (snow, leaves, sparks etc.)
const ambientParticles=[];
function spawnAmbient(){
  const theme=getTheme();
  if(Math.random()>0.15)return;
  const x=Math.random()*GAME_W, y=Math.random()*GAME_H;
  let p={x,y,opacity:0,life:0,maxLife:80+Math.random()*80};
  if(theme.particle==='snow'){p={...p,vx:(Math.random()-0.5)*0.5,vy:0.6+Math.random()*0.6,size:Math.random()*3+1,color:'#b0e8ff',type:'snow'};}
  else if(theme.particle==='leaf'){p={...p,vx:(Math.random()-0.5)*1,vy:0.4+Math.random()*0.5,size:Math.random()*4+2,rot:Math.random()*Math.PI,color:'#40aa40',type:'leaf'};}
  else if(theme.particle==='ember'){p={...p,vx:(Math.random()-0.5)*1.5,vy:-(0.5+Math.random()*1),size:Math.random()*3+1,color:Math.random()>0.5?'#ff6600':'#ffaa00',type:'ember'};}
  else if(theme.particle==='star'){p={...p,vx:(Math.random()-0.5)*0.5,vy:-0.3-Math.random()*0.5,size:Math.random()*3+1,color:'#ffe04a',type:'star'};}
  else if(theme.particle==='sparkle'){p={...p,vx:(Math.random()-0.5)*0.4,vy:-0.2-Math.random()*0.4,size:Math.random()*2+1,color:'#c9a0ff',type:'sparkle'};}
  else{p={...p,vx:(Math.random()-0.5)*2,vy:-0.5-Math.random()*0.8,size:Math.random()*2+0.5,color:'#ff69b4',type:'spark'};}
  ambientParticles.push(p);
}
function updateAndDrawAmbient(){
  spawnAmbient();
  for(let i=ambientParticles.length-1;i>=0;i--){
    const p=ambientParticles[i];
    p.life++;p.x+=p.vx;p.y+=p.vy;
    p.opacity=p.life<10?p.life/10:p.life>p.maxLife-10?(p.maxLife-p.life)/10:0.6;
    if(p.life>=p.maxLife){ambientParticles.splice(i,1);continue;}
    ctx.save();ctx.globalAlpha=p.opacity;
    if(p.type==='leaf'){ctx.translate(p.x,p.y);ctx.rotate(p.rot+p.life*0.05);ctx.beginPath();ctx.ellipse(0,0,p.size,p.size*0.5,0,0,Math.PI*2);ctx.fillStyle=p.color;ctx.fill();}
    else{ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fillStyle=p.color;ctx.fill();}
    ctx.restore();
  }
}

// ══════════════════════════════════════
//  HEART SYSTEM
//  base hearts = character.lives
//  hidden hearts = +2 for everyone
//  maxLives = base + hiddenHearts (cap)
//  At floor 5,10,15...:
//    +1 heart recovery
//    if no hearts lost → +1 bonus heart (up to hiddenHeart cap)
// ══════════════════════════════════════
const HIDDEN_HEARTS = 2;   // extra hearts everyone gets
// PHASE constants (Lavi nerf)


let baseMaxLives=3;   // character's base lives
let bonusLives=0;     // earned bonus hearts (from floor 5 milestone)
let hiddenLives=0;    // current hidden hearts remaining
let maxLives=3;       // = baseMaxLives + bonusLives + hidden (display cap)
let lives=3;
let livesAtFloorStart=3; // to check if we lost any this floor

// Hearts layout:
//   [base hearts][bonus hearts (gold)][hidden hearts (dim)]
// Hidden hearts are shown dimmer, bonus are gold-tinted

function computeMaxLives(){
  // total cap = base + HIDDEN_HEARTS + bonusLives
  return baseMaxLives + bonusLives + HIDDEN_HEARTS;
}

function applyFloor5Reward(){
  // Called when entering a multiple-of-5 floor
  const cap = computeMaxLives();
  // Recover 1 lost heart (can't exceed cap)
  if(lives < cap){ lives = Math.min(lives+1, cap); spawnFloor5FX(); playTone(784,'triangle',0.3,0.2); }
  // If no hearts lost this floor AND bonus hearts < HIDDEN_HEARTS cap → gain one
  const noLossThisFloor = lives >= livesAtFloorStart;
  if(noLossThisFloor && bonusLives < HIDDEN_HEARTS){
    bonusLives++;
    // Also give the heart immediately
    lives = Math.min(lives+1, computeMaxLives());
    spawnFloatLabel(GAME_W/2, GAME_H/2-60, '💛 Bonus heart!');
    playTone(1047,'triangle',0.3,0.15,0.1);
  }
}

const floor5FX=[];
function spawnFloor5FX(){
  for(let i=0;i<24;i++){
    const a=Math.random()*Math.PI*2,sp=2+Math.random()*4;
    floor5FX.push({x:GAME_W/2,y:GAME_H/2,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,size:Math.random()*5+2,opacity:1,color:Math.random()>0.5?'#ffe04a':'#ff85c2'});
  }
  spawnFloatLabel(GAME_W/2,GAME_H/2-40,'❤️ Heart recovered!');
}
function updateAndDrawFloor5FX(){
  for(let i=floor5FX.length-1;i>=0;i--){
    const p=floor5FX[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.1;p.opacity-=0.03;p.size*=0.96;
    if(p.opacity<=0){floor5FX.splice(i,1);continue;}
    ctx.save();ctx.globalAlpha=p.opacity;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fillStyle=p.color;ctx.fill();ctx.restore();
  }
}

function playTone(freq,type='sine',vol=0.3,dur=0.12,delay=0){
  if(sfxVol===0)return;

    osc.connect(gain);gain.connect(ac.destination);
    osc.type=type;osc.frequency.setValueAtTime(freq,ac.currentTime+delay);
    const v=vol*sfxVol;
    gain.gain.setValueAtTime(v,ac.currentTime+delay);
    gain.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+delay+dur);
    osc.start(ac.currentTime+delay);osc.stop(ac.currentTime+delay+dur+0.02);
  }catch(e){}
}

// ══════════════════════════════════════
//  THEME MUSIC  (Web Audio — 긴 루프)
//  scheduleLoop 이 30회 반복을 예약해서
//  레벨 중간에 음악이 끊기지 않음.
//  각 테마마다 멜로디 A + 멜로디 B를
//  번갈아 넣어 더 다양하게 들림.
// ══════════════════════════════════════
let musicNodes=[];
let musicGainNode=null;
let currentMusicTheme=-1;
let musicLoopHandle=null;  // setInterval for re-scheduling

function getMusicGain(){
  if(!musicGainNode){
    const ac=getAudio();
    musicGainNode=ac.createGain();
    musicGainNode.gain.value=musicVol;
    musicGainNode.connect(ac.destination);
  }
  return musicGainNode;
}

function stopMusic(){
  if(musicLoopHandle){clearInterval(musicLoopHandle);musicLoopHandle=null;}
  musicNodes.forEach(n=>{try{n.stop();}catch(e){}});
  musicNodes=[];
}

function setMusicVolume(v){
  musicVol=v;
  if(musicGainNode) musicGainNode.gain.setTargetAtTime(v,getAudio().currentTime,0.05);
}

// 노트 배열을 loopLen 간격으로 30번 예약
// → 30 × 최장 루프(8초) = 240초 = 4분. 충분!
function scheduleLoop(notes, loopLen, type='triangle', baseVol=0.15){
  if(musicVol===0)return;
  const ac=getAudio(), mg=getMusicGain();
  const start=ac.currentTime+0.05;
  for(let rep=0;rep<30;rep++){
    notes.forEach(n=>{
      try{
        const osc=ac.createOscillator(), gain=ac.createGain();
        osc.connect(gain); gain.connect(mg);
        osc.type=n.type||type;
        osc.frequency.value=n.f;
        const t0=start+rep*loopLen+n.t;
        gain.gain.setValueAtTime((n.vol||baseVol), t0);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0+n.d);
        osc.start(t0); osc.stop(t0+n.d+0.02);
        musicNodes.push(osc);
      }catch(e){}
    });
  }
}

let tension=0,heartbeatTimer=0,heartbeatInterval=180;
const TENSION_RISE=0.025,TENSION_FALL=0.008;
function updateTension(pDist){
  if(playerHiding){tension=Math.max(0,tension-0.03);heartbeatTimer=0;return;}
  const target=pDist<80?1:pDist<140?0.65:pDist<200?0.3:0;
  tension=target>tension?Math.min(1,tension+TENSION_RISE):Math.max(0,tension-TENSION_FALL);
  heartbeatInterval=Math.floor(180-tension*140);
  heartbeatTimer--;
  if(heartbeatTimer<=0&&tension>0.15&&sfxVol>0){heartbeatTimer=heartbeatInterval;playTone(60,'sine',0.05+tension*0.15,0.06,0);playTone(55,'sine',(0.05+tension*0.15)*0.7,0.06,0.1);}
}
function drawTensionVignette(){
  if(tension<0.05)return;
  const pulse=(Math.sin(Date.now()*(0.004+tension*0.012))+1)/2;
  const vg=ctx.createRadialGradient(GAME_W/2,GAME_H/2,GAME_W*0.2,GAME_W/2,GAME_H/2,GAME_W*0.8);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(0.6,'rgba(120,0,0,0)');vg.addColorStop(1,`rgba(180,0,30,${tension*(0.35+pulse*0.25)})`);
  ctx.fillStyle=vg;ctx.fillRect(0,0,GAME_W,GAME_H);
  if(tension>0.75&&pulse>0.92){ctx.fillStyle=`rgba(200,0,40,${(pulse-0.92)*3*tension*0.3})`;ctx.fillRect(0,0,GAME_W,GAME_H);}
}

//  BONUS FLOOR SYSTEM
//  3레벨마다 (3,6,9…) 보너스 레벨 진입.
//  몬스터 없음, 시간제한 30초,
//  모든 아이템 수집 → 보너스 하트 +1
// ══════════════════════════════════════
let isBonusFloor=false;
let bonusTimeLeft=0;          // 남은 초 (매 프레임 감소)
const BONUS_TIME_LIMIT=1800;  // 30초 × 60fps
let bonusFrameTimer=0;        // 프레임 카운터
let bonusCompleted=false;     // 성공 여부

function checkIsBonusFloor(){
  return floorNumber%5===0;
}

function sfxBonusStart(){
  [784,988,1175,1319,1568].forEach((f,i)=>playTone(f,'triangle',0.28,0.12,i*0.08));
}
function sfxBonusWin(){
  [523,659,784,1047,1319,1568,2093].forEach((f,i)=>playTone(f,'triangle',0.3,0.13,i*0.07));
}
function sfxBonusFail(){
  [440,330,220].forEach((f,i)=>playTone(f,'sawtooth',0.25,0.2,i*0.15));
}

function drawBonusOverlay(){
  if(!isBonusFloor)return;
  const secsLeft=Math.ceil(bonusTimeLeft/60);
  const urgency=bonusTimeLeft<300; // 5초 이하
  const pulse=(Math.sin(Date.now()*0.015)+1)/2;

  // 상단 타임바
  const barW=GAME_W-20, barH=8, bx=10, by=46;
  const ratio=bonusTimeLeft/BONUS_TIME_LIMIT;
  ctx.fillStyle='rgba(10,4,25,0.75)';
  ctx.beginPath();ctx.roundRect(bx,by,barW,barH,4);ctx.fill();
  ctx.fillStyle=urgency?`rgba(255,80,80,${0.8+pulse*0.2})`:'#ffe04a';
  ctx.beginPath();ctx.roundRect(bx,by,barW*ratio,barH,4);ctx.fill();
  ctx.strokeStyle='rgba(255,220,80,0.3)';ctx.lineWidth=1;
  ctx.beginPath();ctx.roundRect(bx,by,barW,barH,4);ctx.stroke();

  // 타이머 텍스트
  ctx.textAlign='center';ctx.font=`bold ${urgency?16+pulse*3:14}px Segoe UI`;
  ctx.fillStyle=urgency?`rgba(255,80,80,${0.8+pulse*0.2})`:'#ffe04a';
  ctx.shadowColor=urgency?'#ff4444':'#ffaa00';ctx.shadowBlur=urgency?12:6;
  ctx.fillText(`⏱ ${secsLeft}s`,GAME_W/2,by+barH+14);
  ctx.shadowBlur=0;

  // 보너스 레벨 배지
  ctx.font='bold 11px Segoe UI';ctx.fillStyle='rgba(255,210,80,0.85)';
  ctx.textAlign='left';ctx.fillText('🌟 BONUS FLOOR!',14,by-4);

  // 아이템 남은 수 / exit 안내
  const rem=items.filter(i=>!i.collected).length;
  ctx.textAlign='right';ctx.font='bold 11px Segoe UI';
  if(exit.unlocked){
    const p=(Math.sin(Date.now()*0.01)+1)/2;
    ctx.fillStyle=`rgba(255,220,80,${0.7+p*0.3})`;
    ctx.fillText('🚪 Find the EXIT!',GAME_W-14,by-4);
  }else{
    ctx.fillStyle='rgba(255,210,80,0.85)';
    ctx.fillText(`${rem} items left`,GAME_W-14,by-4);
  }
}

function updateBonusFloor(){
  if(!isBonusFloor||bonusCompleted)return;
  bonusFrameTimer++;
  bonusTimeLeft=Math.max(0,BONUS_TIME_LIMIT-bonusFrameTimer);

  // 모든 아이템 수집 → exit 열림 (클리어는 exit 도달 시)
  if(score===totalItemsPerFloor()&&score>0&&!exit.unlocked){
    exit.unlocked=true;
    sfxExitUnlock();
    spawnFloatLabel(GAME_W/2,GAME_H/2-40,'🚪 Exit opened! Get out!');
    triggerShake(4);
    return;
  }

  // 시간 초과 → 실패
  if(bonusTimeLeft===0&&!bonusCompleted){
    bonusCompleted=true;
    sfxBonusFail();
    spawnFloatLabel(GAME_W/2,GAME_H/2-30,'⏰ Time\'s up!');
    setTimeout(()=>startFloorTransition(),1000);
  }
}

    ctx.strokeStyle='#3a2855';ctx.lineWidth=1.5;ctx.beginPath();ctx.roundRect(-10,-13,20,12,2);ctx.stroke();ctx.beginPath();ctx.roundRect(-10,1,20,12,2);ctx.stroke();

function checkExitReached(){

// ══════════════════════════════════════
//  LAVI PHASE ABILITY (original)
//  Hold SHIFT / button → phase through walls
//  Max 80 frames per use, 240f cooldown after
// ══════════════════════════════════════
const PHASE_MAX=60, PHASE_COOLDOWN=180;
let phaseActive=false,phaseTimer=0,phaseCooldown=0;
// 몬스터 경고 상태 추적 (updateMonsters에서 사용)
let prevAlertLevel='far', warnTimer=0;

// phase가 끝났을 때 벽에서 완전히 벗어나도록 밀어냄.
// 플레이어 반경(radius)을 고려해서 네 모서리가 모두 빈 칸인
// 가장 가까운 타일 중심으로 이동.
function pushOutOfWall(){
  // 이미 완전히 빈 칸이면 아무것도 안 함
  if(canMoveTo(player.x, player.y, false)) return;

  // 현재 픽셀 위치에서 BFS로 가장 가까운 안전 위치를 찾음
  const startCol=pixelToTile(player.x);
  const startRow=pixelToTile(player.y);

  // 반경 5타일 이내 BFS
  const visited=new Set();
  const queue=[{c:startCol,r:startRow}];
  visited.add(`${startCol},${startRow}`);
  const dirs=[{dc:0,dr:-1},{dc:0,dr:1},{dc:-1,dr:0},{dc:1,dr:0},{dc:1,dr:1},{dc:-1,dr:-1},{dc:1,dr:-1},{dc:-1,dr:1}];

  while(queue.length){
    const {c,r}=queue.shift();
    const cx=tileCenterX(c), cy=tileCenterY(r);
    // 이 타일 중심으로 이동했을 때 완전히 벽에서 벗어나는지 체크
    if(canMoveTo(cx,cy,false)){
      player.x=cx; player.y=cy;
      spawnFloatLabel(cx,cy-22,'💨');
      return;
    }
    for(const{dc,dr}of dirs){
      const nc=c+dc,nr=r+dr;
      const key=`${nc},${nr}`;
      if(!visited.has(key)&&nc>=0&&nr>=0){
        visited.add(key);
        queue.push({c:nc,r:nr});
      }
      if(visited.size>60) break; // 너무 멀면 중단
    }
  }
}

function updatePhase(){
  if(!activeChar||!activeChar.phaseAbility)return;

  const shiftKey = !!keys['Shift'];
  const touchHeld = !!phaseBtn._held;
  const gpHeld    = (typeof gamepad!=='undefined') && !!gamepad.btnX;
  const phaseHeld = shiftKey || touchHeld || gpHeld;

  phaseBtn.classList.toggle('active', phaseActive);
  phaseBtn.classList.toggle('cooldown', phaseCooldown>0&&!phaseActive);

  if(phaseActive){
    // 페이즈 진행 중
    phaseTimer++;
    // 버튼을 떼거나 최대 시간(1초) 도달 시 종료
    if(!phaseHeld || phaseTimer>=PHASE_MAX){
      phaseActive=false;
      pushOutOfWall();
      // 조금이라도 사용했으면 무조건 3초 쿨다운 시작
      phaseCooldown=PHASE_COOLDOWN;
    }
  } else if(phaseCooldown>0){
    // 쿨다운 중
    phaseCooldown--;
  } else {
    // 대기 중 — 버튼 누르면 즉시 활성화
    if(phaseHeld){
      phaseActive=true;
      phaseTimer=0;
      sfxPhase();
    }
  }
}

// ══════════════════════════════════════
//  MONSTERS  (배열 — 3레벨마다 +1마리)
//  floorNumber 1~3   → 1마리
//  floorNumber 4~6   → 2마리
//  floorNumber 7~9   → 3마리  ... (최대 4마리)
// ══════════════════════════════════════
// 각 몬스터는 고유한 색과 시작 위치를 가짐
const MONSTER_COLORS=['#b388ff','#ff8a80','#80cbc4','#ffcc80'];
// 추가 몬스터 시작 위치 (메인 몬스터 반대편)
const EXTRA_MONSTER_STARTS=[
  {col:1, row:12},
  {col:7, row:1},
  {col:13,row:1},
];

let monsters=[]; // 활성 몬스터 배열

function makeMonster(col,row,colorIdx,speed){
  // 플레이어 시작 위치(1,1)와 너무 가까우면 안전 위치로 이동
  if(Math.abs(col-1)+Math.abs(row-1)<4){col=13;row=12;}
  return{
    x:tileCenterX(col), y:tileCenterY(row),
    radius:16, color:MONSTER_COLORS[colorIdx%MONSTER_COLORS.length],
    speed, pathTimer:0, pathInterval:40+colorIdx*8, // 약간 다른 갱신 속도
    targetCol:col, targetRow:row,
    wobble:0, bobTimer:0+colorIdx*1.2,
    alertLevel:'far', confusedTimer:0,
  };
}

function initMonsters(){
  const def=getFloorDef();
  const diff=getDiffSettings();
  const baseSpeed=diff.monsterSpeed;
  const pathInt=diff.pathInterval;
  // 10층마다 몬스터 1마리 리셋, 그 안에서 3층마다 +1
  const floorsIntoTier=(floorNumber-1)%10;
  const count=Math.min(1+Math.floor(floorsIntoTier/3),4);
  monsters=[];
  monsters.push(makeMonster(def.monsterCol,def.monsterRow,0,baseSpeed));
  for(let i=1;i<count;i++){
    const sp=EXTRA_MONSTER_STARTS[(i-1)%EXTRA_MONSTER_STARTS.length];
    monsters.push(makeMonster(sp.col,sp.row,i,baseSpeed*0.9));
  }
  // 난이도 pathInterval 적용
  monsters.forEach(m=>m.pathInterval=pathInt);
}

function updateMonsters(){
  if(gameState!=='playing')return;
  let closestDist=Infinity;

  monsters.forEach(m=>{
    m.bobTimer+=0.05; m.wobble+=0.06; m.pathTimer++;
    if(m.pathTimer>=m.pathInterval){
      m.pathTimer=0;
      if(playerHiding){
        // 숨을 때 — 옷장에서 멀어지는 방향으로 순찰
        const atTarget=Math.abs(pixelToTile(m.x)-m.targetCol)<=1&&Math.abs(pixelToTile(m.y)-m.targetRow)<=1;
        if(atTarget||m.confusedTimer<=0){
          const map=getMap(),rows=map.length,cols=map[0].length,candidates=[];
          // 플레이어가 숨은 옷장 위치 파악
          const hiddenLocker=hideLockerIndex>=0&&lockers[hideLockerIndex]?lockers[hideLockerIndex]:null;
          const lockerCol=hiddenLocker?pixelToTile(hiddenLocker.x):-1;
          const lockerRow=hiddenLocker?pixelToTile(hiddenLocker.y):-1;
          for(let r=1;r<rows-1;r++)for(let c=1;c<cols-1;c++){
            if(map[r][c]===0){
              const distFromCurrent=Math.abs(c-m.targetCol)+Math.abs(r-m.targetRow);
              // 옷장에서 최소 5타일 이상 떨어진 위치만 선택
              const distFromLocker=lockerCol>=0?Math.abs(c-lockerCol)+Math.abs(r-lockerRow):999;
              if(distFromCurrent>3&&distFromLocker>5) candidates.push({c,r});
            }
          }
          // 옷장 멀리 없으면 그냥 랜덤
          const pool=candidates.length>0?candidates:(()=>{
            const fb=[];
            for(let r=1;r<map.length-1;r++)for(let c=1;c<map[0].length-1;c++)
              if(map[r][c]===0&&Math.abs(c-m.targetCol)+Math.abs(r-m.targetRow)>4)fb.push({c,r});
            return fb;
          })();
          if(pool.length>0){const pick=pool[Math.floor(Math.random()*pool.length)];m.targetCol=pick.c;m.targetRow=pick.r;}
          m.confusedTimer=60+Math.floor(Math.random()*60);
        }else{
          m.confusedTimer--;
          const next=bfsNextStep(pixelToTile(m.x),pixelToTile(m.y),m.targetCol,m.targetRow);
          if(next){m.targetCol=next.col;m.targetRow=next.row;}
        }
      }else{
        const next=bfsNextStep(pixelToTile(m.x),pixelToTile(m.y),pixelToTile(player.x),pixelToTile(player.y));
        if(next){m.targetCol=next.col;m.targetRow=next.row;}
      }
    }

    const tx=tileCenterX(m.targetCol),ty=tileCenterY(m.targetRow);
    const mdx=tx-m.x,mdy=ty-m.y,dist=Math.sqrt(mdx*mdx+mdy*mdy);
    if(dist>1){m.x+=(mdx/dist)*m.speed;m.y+=(mdy/dist)*m.speed;}

    // 몬스터끼리 겹침 방지
    monsters.forEach(other=>{
      if(other===m)return;
      const ox=m.x-other.x,oy=m.y-other.y;
      const od=Math.sqrt(ox*ox+oy*oy);
      const minDist=m.radius+other.radius+4;
      if(od<minDist&&od>0){
        const push=(minDist-od)/2;
        m.x+=(ox/od)*push; m.y+=(oy/od)*push;
        other.x-=(ox/od)*push; other.y-=(oy/od)*push;
      }
    });

    const pdx=player.x-m.x,pdy=player.y-m.y,pDist=Math.sqrt(pdx*pdx+pdy*pdy);
    const effDist=playerHiding?999:pDist;
    m.alertLevel=effDist<80?'danger':effDist<160?'near':'far';
    if(pDist<closestDist) closestDist=pDist;
    if(pDist<player.radius+m.radius-8&&!isInvincible()){
      lives--;triggerShake(14);
      if(lives<=0){
        if(isNewHighScore(totalScore))sfxHighScore();else sfxGameOver();
        saveHighScore(totalScore);gameState='gameover';
      }else{
        sfxLoseLife();
        player.x=tileCenterX(1);player.y=tileCenterY(1);player.dangerFlash=0;
        const def=getFloorDef();
        m.x=tileCenterX(def.monsterCol);m.y=tileCenterY(def.monsterRow);
        m.targetCol=def.monsterCol;m.targetRow=def.monsterRow;
        m.alertLevel='far';tension=0;sfxCaught();
      }
    }
  });
  const effClosest=playerHiding?999:closestDist;
  const overallAlert=effClosest<80?'danger':effClosest<160?'near':'far';
  player.dangerFlash=overallAlert==='danger'?(player.dangerFlash+0.15)%(Math.PI*2):0;
  updateTension(effClosest);
  if(overallAlert!==prevAlertLevel){
    if(overallAlert==='near')sfxWarningNear();
    if(overallAlert==='danger')sfxWarningDanger();
    prevAlertLevel=overallAlert;
  }
  if(overallAlert==='danger'){warnTimer++;if(warnTimer%40===0)sfxWarningDanger();}
}

function drawMonster(m){
  const{x,y,radius,color,wobble,bobTimer,alertLevel}=m;
  const bob=Math.sin(bobTimer)*4,wAmt=Math.sin(wobble)*0.06;
  ctx.save();ctx.translate(x,y+bob);ctx.scale(1+wAmt,1-wAmt);
  if(alertLevel==='danger'){const gp=(Math.sin(Date.now()*0.01)+1)/2;ctx.beginPath();ctx.arc(0,0,radius+14+gp*6,0,Math.PI*2);ctx.fillStyle=`rgba(255,50,80,${0.15+gp*0.2})`;ctx.fill();}
  else if(alertLevel==='near'){ctx.beginPath();ctx.arc(0,0,radius+8,0,Math.PI*2);ctx.fillStyle='rgba(180,100,255,0.15)';ctx.fill();}
  ctx.beginPath();ctx.ellipse(0,radius*0.9,radius*0.75,radius*0.25,0,0,Math.PI*2);ctx.fillStyle='rgba(0,0,0,0.35)';ctx.fill();
  ctx.beginPath();ctx.arc(0,0,radius,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();ctx.strokeStyle='#7b52cc';ctx.lineWidth=2;ctx.stroke();
  ctx.beginPath();ctx.arc(-radius*0.3,-radius*0.3,radius*0.3,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,0.35)';ctx.fill();
  [-6,6].forEach(ex=>{ctx.beginPath();ctx.arc(ex,-4,5,0,Math.PI*2);ctx.fillStyle='#1a0a2e';ctx.fill();ctx.strokeStyle='#5533aa';ctx.lineWidth=1;ctx.stroke();ctx.beginPath();ctx.arc(ex+1,-5,1.5,0,Math.PI*2);ctx.fillStyle='rgba(200,180,255,0.9)';ctx.fill();});
  ctx.beginPath();ctx.moveTo(-8,6);ctx.lineTo(-5,9);ctx.lineTo(-2,6);ctx.lineTo(1,9);ctx.lineTo(4,6);ctx.lineTo(7,9);ctx.strokeStyle='#5533aa';ctx.lineWidth=2;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();
  [-8,-3,3,8].forEach((bx,i)=>{const by=-radius+Math.sin(bobTimer*1.5+i)*2;ctx.beginPath();ctx.arc(bx,by-4,3,0,Math.PI*2);ctx.fillStyle='#9966ff';ctx.fill();});
  if(playerHiding){const qp=(Math.sin(Date.now()*0.008)+1)/2;ctx.font=`bold ${16+qp*4}px Segoe UI`;ctx.fillStyle=`rgba(255,220,100,${0.7+qp*0.3})`;ctx.textAlign='center';ctx.shadowColor='#ffaa00';ctx.shadowBlur=10;ctx.fillText('?',0,-radius-16);ctx.shadowBlur=0;}
  ctx.restore();
}
function drawMonsters(){monsters.forEach(m=>drawMonster(m));}

//  ITEM GENERATION
// ══════════════════════════════════════
const ITEM_TYPES=['tape','star','battery'];
let items=[],score=0;
function generateItems(){
  items=[];const map=getMap();const def=getFloorDef();const rows=map.length,cols=map[0].length;const floorTiles=[];
  const lockerSet=new Set((def.lockerTiles||[]).map(l=>`${l.c},${l.r}`));
  for(let r=1;r<rows-1;r++)for(let c=1;c<cols-1;c++)if(map[r][c]===0&&!(c===1&&r===1)&&!(c===def.exitCol&&r===def.exitRow)&&!lockerSet.has(`${c},${r}`))floorTiles.push({c,r});
  for(let i=floorTiles.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[floorTiles[i],floorTiles[j]]=[floorTiles[j],floorTiles[i]];}
  for(let i=0;i<Math.min(getDiffSettings().itemCount,floorTiles.length);i++){const{c,r}=floorTiles[i];items.push({type:ITEM_TYPES[i%ITEM_TYPES.length],x:tileCenterX(c),y:tileCenterY(r),collected:false,bobTimer:Math.random()*Math.PI*2,glowPulse:Math.random()*Math.PI*2});}
}
const totalItemsPerFloor=()=>items.length;

// ══════════════════════════════════════
//  BFS PATHFINDING
// ══════════════════════════════════════
function bfsNextStep(fc,fr,tc,tr){
  if(fc===tc&&fr===tr)return null;
  const queue=[],visited=new Set();visited.add(`${fc},${fr}`);
  const dirs=[{dc:0,dr:-1},{dc:0,dr:1},{dc:-1,dr:0},{dc:1,dr:0}];
  for(const{dc,dr}of dirs){const nc=fc+dc,nr=fr+dr;if(!isWall(nc,nr)){const k=`${nc},${nr}`;if(!visited.has(k)){visited.add(k);queue.push({col:nc,row:nr,firstStep:{col:nc,row:nr}});}}}
  while(queue.length>0){const{col,row,firstStep}=queue.shift();if(col===tc&&row===tr)return firstStep;for(const{dc,dr}of dirs){const nc=col+dc,nr=row+dr;if(!isWall(nc,nr)){const k=`${nc},${nr}`;if(!visited.has(k)){visited.add(k);queue.push({col:nc,row:nr,firstStep});}}}}
  return null;
}

function canMoveTo(nx,ny,ignoreWalls=false){
  if(ignoreWalls)return true;
  const r=player.radius-2;
  return [{x:nx-r,y:ny-r},{x:nx+r,y:ny-r},{x:nx-r,y:ny+r},{x:nx+r,y:ny+r}].every(c=>!isWall(pixelToTile(c.x),pixelToTile(c.y)));
}

function drawMaze(){
  const map=getMap(),rows=map.length,cols=map[0].length;
  const theme=getTheme();

  // 배경 틴트
  ctx.fillStyle=theme.bgTint;ctx.fillRect(0,0,GAME_W,GAME_H);

  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      const x=c*TILE_SIZE, y=r*TILE_SIZE;
      if(map[r][c]===1){
        // ── 벽 ──
        // 1) 벽 본체 (어두운 색)
        ctx.fillStyle=theme.wall;
        ctx.fillRect(x,y,TILE_SIZE,TILE_SIZE);

        // 2) 윗면 하이라이트 (밝은 선 — 3D 느낌)
        ctx.fillStyle=theme.wallTop;
        ctx.fillRect(x,y,TILE_SIZE,5);

        // 3) 왼쪽 하이라이트
        ctx.fillStyle='rgba(255,255,255,0.07)';
        ctx.fillRect(x,y,4,TILE_SIZE);

        // 4) 오른쪽 + 아래 그림자
        ctx.fillStyle='rgba(0,0,0,0.45)';
        ctx.fillRect(x+TILE_SIZE-3,y,3,TILE_SIZE);
        ctx.fillRect(x,y+TILE_SIZE-3,TILE_SIZE,3);

        // 5) 벽 테두리 — 핵심! 인접 바닥 타일과의 경계를 명확히
        ctx.strokeStyle='rgba(0,0,0,0.7)';
        ctx.lineWidth=1.5;
        ctx.strokeRect(x+0.75,y+0.75,TILE_SIZE-1.5,TILE_SIZE-1.5);

      }else{
        // ── 바닥 ──
        ctx.fillStyle=(r+c)%2===0?theme.floorA:theme.floorB;
        ctx.fillRect(x,y,TILE_SIZE,TILE_SIZE);

        // 바닥 타일 사이 미세한 격자선
        ctx.strokeStyle='rgba(255,255,255,0.04)';
        ctx.lineWidth=0.5;
        ctx.strokeRect(x,y,TILE_SIZE,TILE_SIZE);
      }
    }
  }

  // ── 벽/바닥 경계 강조 패스 ──
  // 벽 옆에 바닥이 있는 경계에 밝은 선을 추가로 그림
  ctx.strokeStyle='rgba(255,255,255,0.18)';
  ctx.lineWidth=1;
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      if(map[r][c]!==1) continue;
      const x=c*TILE_SIZE, y=r*TILE_SIZE;
      // 아래쪽이 바닥이면 아래 테두리에 밝은 선
      if(r+1<rows&&map[r+1][c]===0){
        ctx.beginPath();ctx.moveTo(x,y+TILE_SIZE);ctx.lineTo(x+TILE_SIZE,y+TILE_SIZE);ctx.stroke();
      }
      // 오른쪽이 바닥이면 오른쪽 테두리에 밝은 선
      if(c+1<cols&&map[r][c+1]===0){
        ctx.beginPath();ctx.moveTo(x+TILE_SIZE,y);ctx.lineTo(x+TILE_SIZE,y+TILE_SIZE);ctx.stroke();
      }
    }
  }
}

function drawWarningBorder(){
  // 가장 위협적인 몬스터 기준
  const alertLevel=monsters.reduce((best,m)=>{
    if(m.alertLevel==='danger')return'danger';
    if(m.alertLevel==='near'&&best==='far')return'near';
    return best;
  },'far');
  if(alertLevel==='far')return;
  const pulse=(Math.sin(Date.now()*0.008)+1)/2;
  const color=alertLevel==='danger'?`rgba(255,50,80,${0.3+pulse*0.4})`:`rgba(255,180,50,${0.15+pulse*0.25})`;
  ctx.save();ctx.strokeStyle=color;ctx.lineWidth=alertLevel==='danger'?6:3;ctx.shadowColor=color;ctx.shadowBlur=20;ctx.strokeRect(2,2,GAME_W-4,GAME_H-4);ctx.restore();
}

function drawTorchLight(){
  const base=getEffectiveTorch();
  // 가장 가까운 몬스터 기준으로 torch 범위 결정
  const bestAlert=monsters.reduce((best,m)=>{
    if(m.alertLevel==='danger')return'danger';
    if(m.alertLevel==='near'&&best==='far')return'near';
    return best;
  },'far');
  const r=base*(1-tension*0.35)*(bestAlert==='danger'?0.75:bestAlert==='near'?0.88:1);
  const g=ctx.createRadialGradient(player.x,player.y,20,player.x,player.y,r);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(0.5,'rgba(0,0,0,0.15)');g.addColorStop(1,`rgba(0,0,0,${0.78+tension*0.15})`);
  ctx.fillStyle=g;ctx.fillRect(0,0,GAME_W,GAME_H);
}

const popParticles=[];
function spawnPopParticles(x,y,color){for(let i=0;i<10;i++){const a=(Math.PI*2/10)*i+Math.random()*0.3,sp=Math.random()*2.5+1;popParticles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,size:Math.random()*4+2,opacity:1,color});}}
function updateAndDrawPopParticles(){for(let i=popParticles.length-1;i>=0;i--){const p=popParticles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.08;p.opacity-=0.04;p.size*=0.95;if(p.opacity<=0){popParticles.splice(i,1);continue;}ctx.save();ctx.globalAlpha=p.opacity;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fillStyle=p.color;ctx.fill();ctx.restore();}}
const floatLabels=[];
function spawnFloatLabel(x,y,text){floatLabels.push({x,y,text,opacity:1,vy:-1.2});}
function updateAndDrawFloatLabels(){for(let i=floatLabels.length-1;i>=0;i--){const f=floatLabels[i];f.y+=f.vy;f.opacity-=0.025;if(f.opacity<=0){floatLabels.splice(i,1);continue;}ctx.save();ctx.globalAlpha=f.opacity;ctx.font='bold 14px Segoe UI';ctx.fillStyle='#fff';ctx.textAlign='center';ctx.shadowColor='#ff69b4';ctx.shadowBlur=8;ctx.fillText(f.text,f.x,f.y);ctx.restore();}}

// ══════════════════════════════════════
//  ITEM EFFECTS
//  📼 tape    → ⚡ 속도 UP  (5초, ×1.8 speed)
//  ⭐ star    → 🛡️ 무적    (4초, 몬스터 무시)
//  🔋 battery → 👁️ 시야 UP (5초, ×1.6 torch)
//  같은 종류 먹으면 타이머 연장됨
// ══════════════════════════════════════
const FX_SPEED_DUR=300, FX_STAR_DUR=240, FX_BATTERY_DUR=300;
let fxSpeed=0, fxStar=0, fxBattery=0;

function updateItemFX(){
  if(fxSpeed>0)   fxSpeed--;
  if(fxStar>0)    fxStar--;
  if(fxBattery>0) fxBattery--;
}

// 효과 적용된 실제 값
function getEffectiveSpeed() { return player.speed*(fxSpeed>0?1.8:1); }
function getEffectiveTorch() { return player.torchRange*(fxBattery>0?1.6:1); }
function isInvincible()      { return fxStar>0||phaseActive||playerHiding; }

// HUD 아래 효과 바 3개
function drawEffectBar(){
  const effects=[];
  if(fxSpeed>0)   effects.push({icon:'⚡',label:'SPEED',  color:'#ff85c2',t:fxSpeed/FX_SPEED_DUR,      dur:FX_SPEED_DUR});
  if(fxStar>0)    effects.push({icon:'🛡️',label:'SHIELD', color:'#ffe04a',t:fxStar/FX_STAR_DUR,        dur:FX_STAR_DUR});
  if(fxBattery>0) effects.push({icon:'👁️',label:'SIGHT',  color:'#80ffcc',t:fxBattery/FX_BATTERY_DUR,  dur:FX_BATTERY_DUR});
  if(!effects.length)return;
  effects.forEach((e,i)=>{
    const bw=88,bh=15,gap=4;
    const totalW=effects.length*(bw+gap)-gap;
    const bx=GAME_W/2-totalW/2+i*(bw+gap), by=44;
    const pulse=(Math.sin(Date.now()*0.01)+1)/2;
    ctx.fillStyle='rgba(10,4,25,0.82)';ctx.beginPath();ctx.roundRect(bx,by,bw,bh,5);ctx.fill();
    ctx.fillStyle=e.color;ctx.globalAlpha=0.8+pulse*0.2;
    ctx.beginPath();ctx.roundRect(bx,by,bw*e.t,bh,5);ctx.fill();
    ctx.globalAlpha=1;
    ctx.strokeStyle=e.color;ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(bx,by,bw,bh,5);ctx.stroke();
    ctx.font='bold 9px Segoe UI';ctx.fillStyle='#fff';ctx.textAlign='center';
    ctx.shadowColor=e.color;ctx.shadowBlur=5;
    ctx.fillText(`${e.icon}${e.label} ${Math.ceil(e.t*e.dur/60)}s`,bx+bw/2,by+10);
    ctx.shadowBlur=0;
  });
}

// 무적 상태 — 회전 방어막 + 별
function drawInvincibleAura(){
  if(fxStar<=0||playerHiding)return;
  const pulse=(Math.sin(Date.now()*0.015)+1)/2;
  ctx.save();ctx.translate(player.x,player.y);
  ctx.rotate(Date.now()*0.003);
  for(let i=0;i<6;i++){
    const a=(Math.PI*2/6)*i;
    ctx.beginPath();ctx.arc(Math.cos(a)*20,Math.sin(a)*20,3+pulse*2,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,230,80,${0.5+pulse*0.5})`;ctx.fill();
  }
  ctx.restore();
  ctx.save();ctx.translate(player.x,player.y);
  ctx.beginPath();ctx.arc(0,0,player.radius+8+pulse*4,0,Math.PI*2);
  ctx.strokeStyle=`rgba(255,230,80,${0.25+pulse*0.3})`;ctx.lineWidth=3;ctx.stroke();
  ctx.restore();
}

// 속도 업 — 뒤에 잔상 선
function drawSpeedLines(){
  if(fxSpeed<=0||!player.isMoving||playerHiding)return;
  const angle=Math.atan2(player.facingY||0,player.facingX||1)+Math.PI;
  for(let i=0;i<4;i++){
    const spread=(i-1.5)*7,len=8+Math.random()*14;
    const ox=Math.cos(angle+Math.PI/2)*spread,oy=Math.sin(angle+Math.PI/2)*spread;
    ctx.save();ctx.globalAlpha=0.35+Math.random()*0.3;
    ctx.strokeStyle='#ff85c2';ctx.lineWidth=2;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(player.x+ox,player.y+oy);
    ctx.lineTo(player.x+ox+Math.cos(angle)*len,player.y+oy+Math.sin(angle)*len);
    ctx.stroke();ctx.restore();
  }
}

// 시야 업 — 아이템 때 토치 범위 확장 (drawTorchLight에서 getEffectiveTorch 사용)

// ── 아이템 그리기 ──
function drawItem(it){
  if(it.collected)return;
  const{x,y,type,bobTimer,glowPulse}=it;const bob=Math.sin(bobTimer)*3,glow=(Math.sin(glowPulse)+1)/2;
  ctx.save();ctx.translate(x,y+bob);
  if(type==='tape'){
    ctx.beginPath();ctx.arc(0,0,14,0,Math.PI*2);ctx.fillStyle=`rgba(255,180,220,${0.3+glow*0.4})`;ctx.fill();
    ctx.beginPath();ctx.roundRect(-9,-6,18,12,3);ctx.fillStyle='#ff85c2';ctx.fill();ctx.strokeStyle='#cc3377';ctx.lineWidth=1.5;ctx.stroke();
    ctx.beginPath();ctx.arc(-4,0,3,0,Math.PI*2);ctx.fillStyle='#1e0f3a';ctx.fill();ctx.strokeStyle='#cc3377';ctx.lineWidth=1;ctx.stroke();
    ctx.beginPath();ctx.arc(4,0,3,0,Math.PI*2);ctx.fillStyle='#1e0f3a';ctx.fill();ctx.stroke();
    ctx.font='9px serif';ctx.fillStyle='rgba(255,80,180,0.95)';ctx.textAlign='center';ctx.fillText('⚡',0,-17);
  } else if(type==='star'){
    ctx.beginPath();ctx.arc(0,0,15,0,Math.PI*2);ctx.fillStyle=`rgba(255,230,100,${0.3+glow*0.5})`;ctx.fill();
    ctx.beginPath();for(let i=0;i<5;i++){const oa=(Math.PI*2/5)*i-Math.PI/2,ia=oa+Math.PI/5;if(i===0)ctx.moveTo(Math.cos(oa)*10,Math.sin(oa)*10);else ctx.lineTo(Math.cos(oa)*10,Math.sin(oa)*10);ctx.lineTo(Math.cos(ia)*4.5,Math.sin(ia)*4.5);}
    ctx.closePath();ctx.fillStyle='#ffe04a';ctx.fill();ctx.strokeStyle='#cc9900';ctx.lineWidth=1.2;ctx.stroke();
    ctx.font='9px serif';ctx.fillStyle='rgba(255,210,0,0.95)';ctx.textAlign='center';ctx.fillText('🛡️',0,-19);
  } else {
    ctx.beginPath();ctx.arc(0,0,14,0,Math.PI*2);ctx.fillStyle=`rgba(150,255,200,${0.3+glow*0.4})`;ctx.fill();
    ctx.beginPath();ctx.roundRect(-7,-9,14,16,2);ctx.fillStyle='#80ffcc';ctx.fill();ctx.strokeStyle='#00aa66';ctx.lineWidth=1.5;ctx.stroke();
    ctx.beginPath();ctx.roundRect(-3,-12,6,4,1);ctx.fillStyle='#80ffcc';ctx.fill();ctx.stroke();
    ctx.font='9px serif';ctx.fillStyle='rgba(80,255,180,0.95)';ctx.textAlign='center';ctx.fillText('👁️',0,-17);
  }
  ctx.restore();
}
function drawItems(){items.forEach(it=>{if(!it.collected){it.bobTimer+=0.04;it.glowPulse+=0.06;}drawItem(it);});}

// ── 효과 발동 ──
function applyItemEffect(type,x,y){
  if(type==='tape'){
    fxSpeed=FX_SPEED_DUR;
    spawnFloatLabel(x,y-12,'⚡ SPEED UP!');
    playTone(880,'square',0.2,0.05);playTone(1100,'square',0.18,0.05,0.05);
  } else if(type==='star'){
    fxStar=FX_STAR_DUR;
    spawnFloatLabel(x,y-12,'🛡️ INVINCIBLE!');
    [523,659,784,1047].forEach((f,i)=>playTone(f,'triangle',0.25,0.1,i*0.06));
    triggerShake(3);
  } else {
    fxBattery=FX_BATTERY_DUR;
    spawnFloatLabel(x,y-12,'👁️ SIGHT UP!');
    playTone(660,'sine',0.2,0.08);playTone(990,'sine',0.18,0.1,0.07);
  }
}

// ── 아이템 수집 체크 ──
function checkCollectItems(){
  if(gameState!=='playing'||playerHiding)return;
  items.forEach(it=>{
    if(it.collected)return;const dx=player.x-it.x,dy=player.y-it.y;
    if(Math.sqrt(dx*dx+dy*dy)<player.radius+12){
      it.collected=true;score++;sfxCollect(it.type);
      const c=it.type==='tape'?'#ff85c2':it.type==='star'?'#ffe04a':'#80ffcc';
      spawnPopParticles(it.x,it.y,c);
      spawnScorePop(it.x+20,it.y-10,`+${POINTS_PER_ITEM}`,'#ffe04a');
      applyItemEffect(it.type,it.x,it.y);
      if(score===totalItemsPerFloor()){exit.unlocked=true;sfxExitUnlock();spawnFloatLabel(exit.x,exit.y-30,'🚪 EXIT OPEN!');triggerShake(4);}
    }
  });
}

// ══════════════════════════════════════
//  PLAYER UPDATE + DRAW
// ══════════════════════════════════════
const keys={};
function update(){
  if(gameState!=='playing')return;
  updateGamepad();
  updatePhase();updateHiding();updateNearLocker();updateItemFX();
  if(isBonusFloor) updateBonusFloor();
  if(playerHiding)return;
  const spd=getEffectiveSpeed();
  let dx=0,dy=0;
  if(keys['ArrowLeft']||keys['a']||keys['A'])dx-=spd;
  if(keys['ArrowRight']||keys['d']||keys['D'])dx+=spd;
  if(keys['ArrowUp']||keys['w']||keys['W'])dy-=spd;
  if(keys['ArrowDown']||keys['s']||keys['S'])dy+=spd;
  if(joystick.active){dx+=joystick.dx*spd;dy+=joystick.dy*spd;}
  // 게임패드 이동
  if(gamepad.dx!==0||gamepad.dy!==0){dx+=gamepad.dx*spd;dy+=gamepad.dy*spd;}
  if(dx!==0&&dy!==0){dx*=0.707;dy*=0.707;}
  // Phase: pass through walls, but movement still happens normally
  const ignore=phaseActive;
  if(dx!==0&&canMoveTo(player.x+dx,player.y,ignore))player.x+=dx;
  if(dy!==0&&canMoveTo(player.x,player.y+dy,ignore))player.y+=dy;
  if(dx!==0||dy!==0){player.facingX=dx;player.facingY=dy;player.isMoving=true;}else player.isMoving=false;
  player.wobble=player.isMoving?player.wobble+0.3:player.wobble*0.85;
  player.blinkTimer--;
  if(player.blinkTimer<=0){if(player.isBlinking){player.isBlinking=false;player.blinkTimer=180+Math.random()*120;}else{player.isBlinking=true;player.blinkTimer=8;}}
  checkCollectItems();checkExitReached();
}

function drawPlayer(){
  if(playerHiding)return;
  const{x,y,radius,wobble,isBlinking,isMoving,facingX,facingY,dangerFlash}=player;
  const wAmt=Math.sin(wobble)*0.08;
  const bodyColor=dangerFlash>0?`hsl(${340+Math.sin(dangerFlash)*20},100%,${55+Math.sin(dangerFlash)*10}%)`:player.color;
  ctx.save();ctx.translate(x,y);
  if(phaseActive){ctx.globalAlpha=0.5;ctx.shadowColor='#c9a0ff';ctx.shadowBlur=24;}
  ctx.scale(isMoving?1+wAmt:1,isMoving?1-wAmt:1);
  ctx.beginPath();ctx.ellipse(0,radius*0.85,radius*0.7,radius*0.25,0,0,Math.PI*2);ctx.fillStyle='rgba(0,0,0,0.3)';ctx.fill();
  ctx.beginPath();ctx.arc(0,0,radius+4,0,Math.PI*2);ctx.fillStyle=`${player.color}33`;ctx.fill();
  ctx.beginPath();ctx.arc(0,0,radius,0,Math.PI*2);ctx.fillStyle=bodyColor;ctx.fill();
  ctx.beginPath();ctx.arc(-radius*0.3,-radius*0.3,radius*0.35,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,0.45)';ctx.fill();
  const ex=(facingX!==0?Math.sign(facingX):0)*2,ey2=(facingY!==0?Math.sign(facingY):0)*2,lx=-5+ex,rx=5+ex,eyY=-3+ey2;
  if(isBlinking){ctx.strokeStyle='#7a3060';ctx.lineWidth=2;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(lx-3,eyY);ctx.lineTo(lx+3,eyY);ctx.stroke();ctx.beginPath();ctx.moveTo(rx-3,eyY);ctx.lineTo(rx+3,eyY);ctx.stroke();}
  else{ctx.beginPath();ctx.arc(lx,eyY,4,0,Math.PI*2);ctx.fillStyle='white';ctx.fill();ctx.beginPath();ctx.arc(lx+0.8,eyY+0.8,2.2,0,Math.PI*2);ctx.fillStyle='#3a1040';ctx.fill();ctx.beginPath();ctx.arc(lx-0.3,eyY-0.8,0.8,0,Math.PI*2);ctx.fillStyle='white';ctx.fill();ctx.beginPath();ctx.arc(rx,eyY,4,0,Math.PI*2);ctx.fillStyle='white';ctx.fill();ctx.beginPath();ctx.arc(rx+0.8,eyY+0.8,2.2,0,Math.PI*2);ctx.fillStyle='#3a1040';ctx.fill();ctx.beginPath();ctx.arc(rx-0.3,eyY-0.8,0.8,0,Math.PI*2);ctx.fillStyle='white';ctx.fill();}
  ctx.beginPath();ctx.ellipse(-7,3,4,2.5,0,0,Math.PI*2);ctx.fillStyle=activeChar?activeChar.cheekColor:'rgba(255,100,150,0.4)';ctx.fill();
  ctx.beginPath();ctx.ellipse(7,3,4,2.5,0,0,Math.PI*2);ctx.fillStyle=activeChar?activeChar.cheekColor:'rgba(255,100,150,0.4)';ctx.fill();
  ctx.beginPath();ctx.arc(0,4,5,0.2,Math.PI-0.2);ctx.strokeStyle='#7a3060';ctx.lineWidth=1.8;ctx.stroke();
  if(activeChar)activeChar.drawExtras(ctx,radius);
  ctx.restore();
}

const sparkles=[];let sparkleTimer=0;
function spawnSparkle(){if(!player.isMoving||playerHiding)return;sparkleTimer++;if(sparkleTimer%6!==0)return;const c=phaseActive?'#c9a0ff':activeChar?activeChar.color:'#ff85c2';sparkles.push({x:player.x+(Math.random()-.5)*20,y:player.y+(Math.random()-.5)*20,size:Math.random()*3+1,opacity:0.9,color:c});}
function drawSparkles(){for(let i=sparkles.length-1;i>=0;i--){const s=sparkles[i];s.opacity-=0.06;s.y-=0.6;s.size*=0.94;if(s.opacity<=0){sparkles.splice(i,1);continue;}ctx.save();ctx.globalAlpha=s.opacity;ctx.beginPath();ctx.arc(s.x,s.y,s.size,0,Math.PI*2);ctx.fillStyle=s.color;ctx.fill();ctx.restore();}}

// ══════════════════════════════════════
//  GAMEPAD SUPPORT
//  표준 게임패드 API 사용
//  왼쪽 스틱 / D패드 → 이동
//  A버튼(0) / B버튼(1) → 숨기
//  X버튼(2) → 페이즈 (Lavi)
//  Start(9) / Options → 옵션 메뉴
// ══════════════════════════════════════
const gamepad={dx:0,dy:0,btnA:false,btnB:false,btnX:false,btnStart:false};
let prevGpBtnA=false,prevGpBtnB=false,prevGpBtnX=false,prevGpStart=false;
let connectedGamepad=null; // 연결된 게임패드 직접 추적

// 게임패드 연결/해제 이벤트
window.addEventListener('gamepadconnected',(e)=>{
  connectedGamepad=e.gamepad;
  console.log('Gamepad connected:',e.gamepad.id);
});
window.addEventListener('gamepaddisconnected',(e)=>{
  connectedGamepad=null;
  gamepad.dx=0;gamepad.dy=0;
});

function updateGamepad(){
  // getGamepads()는 매 프레임 최신 상태를 반환 — 인덱스로 접근
  const gps=navigator.getGamepads?navigator.getGamepads():[];
  // 연결된 게임패드 찾기 (첫 번째 활성 게임패드)
  let gp=null;
  for(let i=0;i<gps.length;i++){if(gps[i]){gp=gps[i];break;}}

  if(!gp){
    gamepad.dx=0;gamepad.dy=0;
    gamepad.btnA=false;gamepad.btnB=false;gamepad.btnX=false;gamepad.btnStart=false;
    return;
  }

  const ax=gp.axes[0]??0, ay=gp.axes[1]??0;
  const dead=0.2;
  gamepad.dx=Math.abs(ax)>dead?ax:0;
  gamepad.dy=Math.abs(ay)>dead?ay:0;

  // D패드
  if(gp.buttons[12]?.pressed) gamepad.dy=-1;
  if(gp.buttons[13]?.pressed) gamepad.dy=1;
  if(gp.buttons[14]?.pressed) gamepad.dx=-1;
  if(gp.buttons[15]?.pressed) gamepad.dx=1;

  gamepad.btnA    =gp.buttons[0]?.pressed??false;
  gamepad.btnB    =gp.buttons[1]?.pressed??false;
  gamepad.btnX    =gp.buttons[2]?.pressed??false;
  gamepad.btnStart=gp.buttons[9]?.pressed??false;

  if(gamepad.btnA&&!prevGpBtnA) tryHide();
  if(gamepad.btnStart&&!prevGpStart){
    if(optOpen)closeOptions();
    else if(gameState==='playing'||gameState==='paused')openOptions();
  }

  prevGpBtnA=gamepad.btnA;
  prevGpBtnB=gamepad.btnB;
  prevGpBtnX=gamepad.btnX;
  prevGpStart=gamepad.btnStart;
}

// ══════════════════════════════════════
//  INPUT
// ══════════════════════════════════════
document.addEventListener('keydown',e=>{
  keys[e.key]=true;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();
  if(e.key===' '){
    e.preventDefault();
    if(gameState==='playing') tryHide();
    if(gameState==='gameover'||gameState==='cleared') restartGame();
  }
  if(e.key==='Escape'){
    if(optOpen)closeOptions();
    else if(gameState==='playing'||gameState==='paused')openOptions();
  }
  if((e.key==='c'||e.key==='C')&&gameState==='gameover')goToCharSelect();
  if(e.key==='m'||e.key==='M'){
    const newVol=musicVol>0?0:0.6;
    setMusicVolume(newVol);
    musicSlider.value=Math.round(newVol*100);
    musicValEl.textContent=musicSlider.value;
  }
  if((e.key==='h'||e.key==='H')&&gameState==='playing')tryHide();
});
document.addEventListener('keyup',e=>{keys[e.key]=false;});

canvas.addEventListener('touchend',e=>{
  if(gameState!=='gameover'&&gameState!=='cleared')return;
  e.preventDefault();
  const rect=canvas.getBoundingClientRect();
  const t=e.changedTouches[0];
  const gx=(t.clientX-rect.left)*(GAME_W/rect.width);
  const gy=(t.clientY-rect.top)*(GAME_H/rect.height);

  if(gameState==='cleared'){restartGame();return;}

  const btnY=GAME_H/2+170,btnW=140,btnH=38;
  const leftBtn =gx>GAME_W/2-btnW-8&&gx<GAME_W/2-8  &&gy>btnY&&gy<btnY+btnH;
  const rightBtn=gx>GAME_W/2+8    &&gx<GAME_W/2+btnW+8&&gy>btnY&&gy<btnY+btnH;
  if(leftBtn) restartGame();
  else if(rightBtn) goToCharSelect();
  else restartGame();
},{passive:false});

canvas.addEventListener('click',e=>{
  if(gameState!=='gameover'&&gameState!=='cleared')return;
  const rect=canvas.getBoundingClientRect();
  const gx=(e.clientX-rect.left)*(GAME_W/rect.width);
  const gy=(e.clientY-rect.top)*(GAME_H/rect.height);

  if(gameState==='cleared'){restartGame();return;}

  const btnY=GAME_H/2+170,btnW=140,btnH=38;
  const rightBtn=gx>GAME_W/2+8&&gx<GAME_W/2+btnW+8&&gy>btnY&&gy<btnY+btnH;
  if(rightBtn) goToCharSelect();
  else restartGame();
});

function goToCharSelect(){
  stopMusic();
  gameState='playing';
  optBtn.style.display='none';
  closeOptions();
  document.getElementById('char-select').classList.remove('hidden');
  document.getElementById('gameTitle').style.display='none';
  document.getElementById('gameWrapper').style.display='none';
}
function restartGame(){
  currentFloor=0;floorNumber=1;totalScore=0;floorScore=0;
  lives=baseMaxLives;bonusLives=0;  // 시작 시 기본 하트만
  livesAtFloorStart=lives;gameCleared=false;
  gameState='playing';prevAlertLevel='far';tension=0;
  if(optOpen)closeOptions();
  loadHighScores();loadFloor();
}
function startGame(){
  activeChar=CHARACTERS.find(c=>c.id===selectedCharId);
  baseMaxLives=activeChar.lives;
  bonusLives=0;
  lives=baseMaxLives;  // 시작 시 기본 하트만 (Rosie=3, Minty=5)
  livesAtFloorStart=lives;
  currentFloor=0;floorNumber=1;totalScore=0;floorScore=0;
  gameState='playing';prevAlertLevel='far';tension=0;
  loadHighScores();loadFloor();
}

// ══════════════════════════════════════
//  MAIN GAME LOOP
// ══════════════════════════════════════
function gameLoop(){
  updateShake();
  ctx.save();ctx.translate(shakeX,shakeY);
  ctx.clearRect(-10,-10,GAME_W+20,GAME_H+20);
  drawMaze();
  if(gameState==='playing'){
    updateAndDrawAmbient();
    drawItems();drawLockers();drawExit();
    if(!isBonusFloor){updateMonsters();drawMonsters();}  // 보너스엔 몬스터 없음
    update();spawnSparkle();drawSparkles();
    drawInvincibleAura();drawSpeedLines();
    drawPlayer();
    updateAndDrawPopParticles();updateAndDrawFloatLabels();updateAndDrawScorePops();
    updateAndDrawFloor5FX();
    drawTorchLight();
    if(!isBonusFloor){drawTensionVignette();drawWarningBorder();}
    drawEffectBar();
    drawBonusOverlay();   // 보너스 타이머 바
    drawHUD();
    drawJoystick();
  }else if(gameState==='paused'){
    drawItems();drawLockers();drawExit();drawMonsters();drawPlayer();
    drawTorchLight();drawHUD();
    ctx.fillStyle='rgba(0,0,0,0.45)';ctx.fillRect(0,0,GAME_W,GAME_H);
    ctx.textAlign='center';ctx.font='bold 22px Segoe UI';
    ctx.fillStyle='#ffb3d9';ctx.shadowColor='#ff69b4';ctx.shadowBlur=16;
    ctx.fillText('⏸ Paused',GAME_W/2,GAME_H/2);ctx.shadowBlur=0;
  }else if(gameState==='transition'){
    drawItems();drawLockers();drawExit();drawMonsters();drawPlayer();drawTorchLight();updateTransition();drawTransitionOverlay();
  }else if(gameState==='cleared'){
    drawItems();drawLockers();drawExit();drawMonsters();drawPlayer();drawTorchLight();drawGameCleared();
  }else if(gameState==='gameover'){
    drawItems();drawLockers();drawExit();drawMonsters();drawPlayer();drawTorchLight();drawGameOver();
  }
  ctx.restore();
  requestAnimationFrame(gameLoop);
}

loadHighScores();
gameLoop();
</script>
